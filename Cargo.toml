[package]
name = "restate-sdk-python-core"
version = "1.0.2"
edition = "2021"

[package.metadata.maturin]
name = "restate_sdk._internal"

[lib]
name = "restate_sdk_python_core"
crate-type = ["cdylib"]
doc = false

[dependencies]
pyo3 = { version = "0.25.1", features = ["extension-module"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1"
# Pinned to the `relay` branch, which adds the embedded relay-tunnel receiver
# behind the `tunnel` feature (the RelayTunnel pyclass in src/lib.rs wraps it).
# Swap back to a crates.io `version = "…"` once the `tunnel` feature ships.
restate-sdk-shared-core = { git = "https://github.com/restatedev/sdk-shared-core.git", branch = "relay", features = ["request_identity", "sha2_random_seed", "rust_crypto", "tunnel"] }
