name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, release-**]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-test:
    name: "Lint and Test (Python ${{ matrix.python }})"
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      matrix:
        python: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: extractions/setup-just@v2.0.0
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: just sync 
      - name: Build
        run: just build
      - name: Verify
        run: just verify

  oldest-langgraph:
    # restate.agents.langgraph relies on how LangGraph behaves (its checkpoints, interrupts and ToolNode), which
    # changes between its versions: test it on the oldest LangGraph and LangChain that the langgraph extra allows.
    name: "LangGraph agents on the oldest LangGraph allowed"
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: extractions/setup-just@v2.0.0
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: just sync
      - name: Install the oldest LangGraph and LangChain of the langgraph extra
        run: |
          uv run --no-sync python - > "$RUNNER_TEMP/oldest.txt" <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              extra = tomllib.load(f)["project"]["optional-dependencies"]["langgraph"]
          print("\n".join(r for r in extra if r.startswith(("langgraph", "langchain"))))
          EOF
          # LangChain's create_agent needs a newer langchain-core than the extra's oldest: its tests skip here.
          uv pip uninstall langchain
          # Only these packages change, to their oldest, and what they need with them.
          uv pip install --resolution lowest-direct \
            $(sed -E 's/^([A-Za-z0-9_.-]+).*/--upgrade-package \1/' "$RUNNER_TEMP/oldest.txt") \
            -r "$RUNNER_TEMP/oldest.txt"
          uv pip check
          uv pip list | grep -i '^lang'
      - name: Test the LangGraph agents
        run: uv run --no-sync -m pytest tests/agents_langgraph*.py

  oldest-pydantic-ai:
    # restate.agents.pydantic_ai relies on how Pydantic AI behaves (its capabilities, errors and message history),
    # which changes between its versions: test it on the oldest Pydantic AI that the pydantic_ai extra allows.
    name: "Pydantic AI agents on the oldest Pydantic AI allowed"
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: extractions/setup-just@v2.0.0
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: just sync
      - name: Install the oldest Pydantic AI of the pydantic_ai extra
        run: |
          uv run --no-sync python - > "$RUNNER_TEMP/oldest.txt" <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              extra = tomllib.load(f)["project"]["optional-dependencies"]["pydantic_ai"]
          print("\n".join(r for r in extra if r.startswith("pydantic-ai")))
          EOF
          # Only these packages change, to their oldest, and what they need with them.
          uv pip install --resolution lowest-direct \
            $(sed -E 's/^([A-Za-z0-9_.-]+).*/--upgrade-package \1/' "$RUNNER_TEMP/oldest.txt") \
            -r "$RUNNER_TEMP/oldest.txt"
          uv pip check
          uv pip list | grep -i '^pydantic'
      - name: Test the Pydantic AI agents
        run: uv run --no-sync -m pytest tests/agents_pydantic_ai.py

  no-extras:
    # An ordinary user's install, `pip install restate-sdk`: no new dependencies, and the optional parts
    # (restate.sessions' server, restate.agents' integrations) fail only when used, naming their extra.
    name: "Install without extras (Python ${{ matrix.python }})"
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      matrix:
        python: [ "3.11", "3.14" ]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install it alone into a fresh environment
        run: |
          uv venv /tmp/plain
          uv pip install --python /tmp/plain/bin/python dist/restate_sdk-*.whl
      - name: Check it as an ordinary user gets it
        working-directory: /tmp
        run: /tmp/plain/bin/python -I "$GITHUB_WORKSPACE/scripts/check_no_extras.py"
