[project]
name = "restate-sdk"
description = "A Python SDK for Restate"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Restate Developers", email = "dev@restate.dev" }]
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://restate.dev"
Documentation = "https://docs.restate.dev"
Source = "https://github.com/restatedev/sdk-python"
"Bug Tracker" = "https://github.com/restatedev/sdk-python/issues"

[project.optional-dependencies]
test = ["pytest", "hypercorn", "anyio"]
lint = ["mypy>=1.11.2", "pyright>=1.1.390", "ruff>=0.6.9"]
harness = ["testcontainers", "hypercorn", "httpx"]
serde = ["dacite", "pydantic", "msgspec"]
client = ["httpx[http2]"]
serve = [
    "uvicorn>=0.53 ; python_version >= '3.11'",
    "zttp>=0.0.34 ; python_version >= '3.11'",
]
adk = ["google-adk>=1.20.0"]
openai = ["openai-agents>=0.6.1"]
pydantic_ai = ["pydantic-ai-slim>=2.0,<3", "pydantic>=2"]
anthropic = ["anthropic>=2.4,<3", "pydantic>=2"]
langchain = ["langchain>=1.0.0", "langgraph>=1.0.0", "langchain-core>=1.0.0"]
langgraph = ["langgraph>=1.0.0", "langchain-core>=1.0.0", "pydantic>=2"]
tracing = ["opentelemetry-api>=1.36.0"]
zstd = [
    "backports.zstd ; python_version < '3.14'",
]

[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "restate._internal"
python-source = "python"

# Rebuilt by `uv sync` when the Rust changes, not only the Python.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

# The packages written to be fully typed: strict in both type checkers.
# basedpyright (an editor's, say) reads this section too, as there is no
# [tool.basedpyright] (it refuses both): the mode is set, standard, for it to
# check what pyright does rather than its stricter default, whose Any rules
# do not fit an SDK (Any is what a handler's input or a serialized value is).
# Deprecations are reported, by both.
[tool.pyright]
typeCheckingMode = "standard"
strict = ["python/restate/sessions", "python/restate/agents"]
reportDeprecated = "warning"

[[tool.mypy.overrides]]
module = ["restate.sessions.*", "restate.agents.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[tool.ruff]
line-length = 120
target-version = "py310"
include = [
    "python/**/*.py",
    "examples/**/*.py",
    "examples-agents/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    "test-services//**/*.py",
]

[tool.ruff.lint]
ignore = ["E741"]

[tool.pytest.ini_options]
filterwarnings = [
   "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]
anyio_mode = "auto"
